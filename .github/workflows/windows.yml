name: Bug audit preflight
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact fix commit to check out and validate
        required: true
        type: string
permissions:
  contents: read
jobs:
  msrv:
    name: Rust 1.89 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            integrations/dlr
      - run: cargo check --locked --workspace
      - run: cargo check --locked --manifest-path integrations/dlr/Cargo.toml --workspace

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check-release-version.py
      - run: python3 -m unittest discover -s evaluations/tests -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python3 -m unittest discover -s evaluations/tests -p 'test_*.py'
        env:
          SC_TEST_BINARY: target/debug/marathon

  dlr:
    name: DLR workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/dlr
      - run: cargo fmt --manifest-path integrations/dlr/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path integrations/dlr/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path integrations/dlr/Cargo.toml --workspace

  task-graders:
    name: Independent task graders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: python3 evaluations/run.py validate --out benchmark-results/ci-grader-controls

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: python -m unittest discover -s evaluations/tests -p 'test_*.py'
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Windows PowerShell 5.1
        env:
          SC_POWERSHELL_PATH: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        run: cargo test --locked --workspace
      - name: Test PowerShell 7 shell backend
        run: |
          $env:SC_POWERSHELL_PATH = (Get-Command pwsh.exe).Source
          cargo test --locked -p rc-tools bash::tests
      - name: Exercise the task evaluator with an offline scripted provider
        env:
          SC_TEST_BINARY: target/debug/marathon.exe
        run: python -m unittest discover -s evaluations/tests -p 'test_*.py'
      - name: Test optional Git Bash backend
        env:
          SC_GIT_BASH_PATH: C:\Program Files\Git\bin\bash.exe
        run: cargo test --locked -p rc-tools optional_git_bash
      - name: Build self-contained Windows executable
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin marathon
      - run: ./scripts/package-windows.ps1
      - name: Exercise the real executable against a local mock gateway
        run: node scripts/windows-smoke.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: marathon-x86_64-pc-windows-msvc
          path: |
            dist/marathon-x86_64-pc-windows-msvc.zip
            dist/marathon-x86_64-pc-windows-msvc.zip.sha256
          if-no-files-found: error
